<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAKER — 해커톤 플랫폼</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #21262d;
        --border: #30363d;
        --primary: #7c3aed;
        --pl: #a78bfa;
        --pd: #3d1f7c;
        --green: #22c55e;
        --blue: #3b82f6;
        --gray: #6b7280;
        --orange: #f59e0b;
        --text: #f0f6fc;
        --muted: #8b949e;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }

      /* NAV */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(13, 17, 23, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        height: 60px;
        display: flex;
        align-items: center;
        gap: 2rem;
        padding: 0 1.5rem;
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--pl), #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        cursor: pointer;
      }
      .nav-links {
        display: flex;
        gap: 0.15rem;
      }
      .nl {
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        font-size: 0.88rem;
        color: var(--muted);
        border: none;
        background: none;
        transition: 0.15s;
      }
      .nl:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .nl.active {
        color: var(--pl);
        background: var(--pd);
      }

      /* LAYOUT */
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      .page {
        padding: 2.5rem 0;
      }

      /* HERO */
      .hero {
        text-align: center;
        padding: 5rem 1rem 4rem;
        background: radial-gradient(
          ellipse at center top,
          rgba(124, 58, 237, 0.15) 0%,
          transparent 70%
        );
      }
      .hero-badge {
        display: inline-block;
        padding: 0.3rem 0.9rem;
        background: var(--pd);
        color: var(--pl);
        border-radius: 100px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(124, 58, 237, 0.3);
      }
      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1.15;
        margin-bottom: 1rem;
      }
      .hero h1 span {
        background: linear-gradient(135deg, var(--pl), #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero p {
        color: var(--muted);
        font-size: 1rem;
        max-width: 480px;
        margin: 0 auto 2rem;
      }
      .hero-btns {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* BTN */
      .btn {
        padding: 0.6rem 1.3rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        transition: 0.15s;
        display: inline-block;
      }
      .btn-p {
        background: var(--primary);
        color: #fff;
      }
      .btn-p:hover {
        background: #6d28d9;
        transform: translateY(-1px);
      }
      .btn-o {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-o:hover {
        background: var(--surface2);
        border-color: var(--pl);
      }
      .btn-sm {
        padding: 0.4rem 0.85rem;
        font-size: 0.82rem;
      }

      /* STATS */
      .stats {
        display: flex;
        gap: 2rem;
        padding: 1.5rem 2rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin: 2rem 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .stat-n {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--pl);
      }
      .stat-l {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 0.1rem;
      }

      /* SECTION HEADER */
      .sh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }
      .sh-t {
        font-size: 1.15rem;
        font-weight: 700;
      }
      .sh-l {
        font-size: 0.83rem;
        color: var(--pl);
        background: none;
        border: none;
        padding: 0;
      }
      .sh-l:hover {
        text-decoration: underline;
      }

      /* CARDS */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 1.25rem;
      }
      .hcard {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        transition: 0.2s;
      }
      .hcard:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
      .hcard-thumb {
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
      }
      .hcard-body {
        padding: 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .hcard-title {
        font-size: 0.92rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-bottom: 0.75rem;
      }
      .tag {
        padding: 0.12rem 0.5rem;
        background: var(--surface2);
        border-radius: 4px;
        font-size: 0.7rem;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .hcard-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 0.7rem;
        border-top: 1px solid var(--border);
      }
      .sbadge {
        padding: 0.18rem 0.55rem;
        border-radius: 100px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .s-ongoing {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      .s-upcoming {
        background: rgba(59, 130, 246, 0.15);
        color: var(--blue);
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .s-ended {
        background: rgba(107, 114, 128, 0.15);
        color: var(--gray);
        border: 1px solid rgba(107, 114, 128, 0.3);
      }
      .dl {
        font-size: 0.73rem;
        color: var(--muted);
      }

      /* PAGE HEADER */
      .ph {
        margin-bottom: 2rem;
      }
      .ph h1 {
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 0.35rem;
      }
      .ph p {
        color: var(--muted);
        font-size: 0.93rem;
      }
      .ph-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }

      /* FILTER TABS */
      .ftabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .ftab {
        padding: 0.4rem 0.85rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
      }
      .ftab:hover {
        border-color: var(--pl);
        color: var(--text);
      }
      .ftab.active {
        background: var(--pd);
        border-color: var(--primary);
        color: var(--pl);
      }

      /* DETAIL HEADER */
      .dh {
        background: linear-gradient(
          135deg,
          var(--surface),
          rgba(124, 58, 237, 0.08)
        );
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        margin-bottom: 2rem;
      }
      .dh h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0.75rem 0 1rem;
        line-height: 1.3;
      }
      .dh-meta {
        display: flex;
        gap: 1.25rem;
        font-size: 0.8rem;
        color: var(--muted);
        flex-wrap: wrap;
      }

      /* TAB NAV */
      .tab-nav {
        display: flex;
        border-bottom: 1px solid var(--border);
        margin-bottom: 2rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab-nav::-webkit-scrollbar {
        display: none;
      }
      .tbtn {
        padding: 0.7rem 1rem;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 500;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: 0.15s;
      }
      .tbtn:hover {
        color: var(--text);
      }
      .tbtn.active {
        color: var(--pl);
        border-bottom-color: var(--primary);
      }

      /* CONTENT BOX */
      .box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1.25rem;
      }
      .box h3 {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 0.85rem;
        color: var(--pl);
      }
      .box p {
        color: var(--muted);
        line-height: 1.7;
      }

      /* INFO LIST */
      .ilist {
        list-style: none;
      }
      .ilist li {
        padding: 0.45rem 0;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.88rem;
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .ilist li:last-child {
        border-bottom: none;
      }
      .ilist li::before {
        content: "•";
        color: var(--primary);
        flex-shrink: 0;
      }

      /* METRICS */
      .metrics {
        display: flex;
        gap: 0.85rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .metric {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem 1.1rem;
      }
      .metric-l {
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 0.15rem;
      }
      .metric-v {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--pl);
      }

      /* SCORE BAR */
      .sbar-wrap {
        margin-top: 0.75rem;
      }
      .sbar-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 0.3rem;
      }
      .sbar {
        height: 7px;
        background: var(--surface2);
        border-radius: 4px;
        overflow: hidden;
      }
      .sbar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--pl));
        border-radius: 4px;
        transition: width 0.5s;
      }

      /* TIMELINE */
      .timeline {
        position: relative;
        padding-left: 1.5rem;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 0.4rem;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .titem {
        position: relative;
        padding: 0.5rem 0 0.5rem 1rem;
      }
      .titem::before {
        content: "";
        position: absolute;
        left: -1.15rem;
        top: 0.85rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        border: 2px solid var(--bg);
      }
      .titem.past::before {
        background: var(--gray);
      }
      .tdate {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .tname {
        font-size: 0.88rem;
        font-weight: 600;
        margin-top: 0.1rem;
      }

      /* PRIZE */
      .pgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
      .pcard {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.2rem;
        text-align: center;
      }
      .pcard:nth-child(1) {
        border-color: #f59e0b;
      }
      .pcard:nth-child(2) {
        border-color: #9ca3af;
      }
      .pcard:nth-child(3) {
        border-color: #92400e;
      }
      .pplace {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .pamount {
        font-size: 1.2rem;
        font-weight: 800;
      }
      .pcard:nth-child(1) .pamount {
        color: #f59e0b;
      }
      .pcard:nth-child(2) .pamount {
        color: #d1d5db;
      }
      .pcard:nth-child(3) .pamount {
        color: #cd7f32;
      }

      /* TABLE */
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }
      .tbl th {
        padding: 0.6rem 0.9rem;
        background: var(--surface2);
        color: var(--muted);
        font-weight: 600;
        text-align: left;
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
      }
      .tbl td {
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }
      .tbl tr:last-child td {
        border-bottom: none;
      }
      .tbl tr:hover td {
        background: var(--surface2);
      }
      .rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-weight: 700;
        font-size: 0.78rem;
      }
      .r1 {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }
      .r2 {
        background: rgba(209, 213, 219, 0.15);
        color: #d1d5db;
        border: 1px solid rgba(209, 213, 219, 0.3);
      }
      .r3 {
        background: rgba(205, 127, 50, 0.15);
        color: #cd7f32;
        border: 1px solid rgba(205, 127, 50, 0.3);
      }
      .rn {
        background: var(--surface2);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      /* TEAM CARD */
      .tcard {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        transition: 0.2s;
      }
      .tcard:hover {
        border-color: var(--primary);
      }
      .tc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .tname {
        font-weight: 700;
        font-size: 0.97rem;
      }
      .opbadge {
        padding: 0.17rem 0.5rem;
        border-radius: 100px;
        font-size: 0.68rem;
        font-weight: 700;
      }
      .op-y {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      .op-n {
        background: var(--surface2);
        color: var(--gray);
        border: 1px solid var(--border);
      }
      .tintro {
        font-size: 0.83rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .lfor {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .ltag {
        padding: 0.12rem 0.5rem;
        background: rgba(124, 58, 237, 0.12);
        color: var(--pl);
        border: 1px solid rgba(124, 58, 237, 0.25);
        border-radius: 4px;
        font-size: 0.7rem;
      }
      .hchip {
        font-size: 0.7rem;
        padding: 0.12rem 0.5rem;
        background: var(--surface2);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      .cbtn {
        padding: 0.45rem 0.9rem;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        transition: 0.15s;
      }
      .cbtn:hover {
        background: #6d28d9;
      }

      /* FORM */
      .fg {
        margin-bottom: 1.1rem;
      }
      .fl {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--muted);
      }
      .fi,
      .fta {
        width: 100%;
        padding: 0.6rem 0.9rem;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 0.88rem;
        font-family: inherit;
        outline: none;
        transition: 0.15s;
      }
      .fi:focus,
      .fta:focus {
        border-color: var(--primary);
      }
      .fta {
        min-height: 90px;
        resize: vertical;
      }

      /* MODAL */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.75rem;
        width: 100%;
        max-width: 460px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .modal-title {
        font-size: 1.05rem;
        font-weight: 700;
      }
      .mclose {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1.2rem;
        padding: 0.2rem;
      }
      .mclose:hover {
        color: var(--text);
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 300;
        background: var(--surface);
        border: 1px solid var(--primary);
        border-radius: 10px;
        padding: 0.8rem 1.2rem;
        font-size: 0.86rem;
        color: var(--pl);
        animation: si 0.25s ease;
        box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
      }
      @keyframes si {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* MISC */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
      }
      .empty .ico {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      hr.div {
        border: none;
        border-top: 1px solid var(--border);
        margin: 2rem 0;
      }
      .ovx {
        overflow-x: auto;
      }
      .info-banner {
        background: rgba(124, 58, 237, 0.08);
        border: 1px solid rgba(124, 58, 237, 0.25);
        border-radius: 10px;
        padding: 0.85rem 1.1rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .lb-note {
        background: rgba(124, 58, 237, 0.08);
        border: 1px solid rgba(124, 58, 237, 0.2);
        border-radius: 8px;
        padding: 0.7rem 1rem;
        margin-bottom: 1.1rem;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .bc {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .bchip {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 0.45rem 0.9rem;
        font-size: 0.8rem;
      }
      .bchip span {
        color: var(--pl);
        font-weight: 700;
      }

      @media (max-width: 640px) {
        .nav {
          gap: 1rem;
        }
        .nav-links {
          gap: 0;
        }
        .nl {
          padding: 0.35rem 0.55rem;
          font-size: 0.8rem;
        }
        .dh h1 {
          font-size: 1.2rem;
        }
        .stats {
          gap: 1.25rem;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="logo" onclick="go('/')">⚡ DAKER</div>

    <div class="box" style="cursor:pointer" onclick="go('/camp')"><h3>👥 팀원 모집</h3><p>함께할 팀을 찾거나 나만의 팀을 만드세요.</p></div>
    <div class="box" style="cursor:pointer" onclick="go('/hackathons?status=upcoming')"><h3>📅 예정 해커톤</h3><p>다가오는 해커톤에 미리 준비하세요.</p></div>
  </div>
</div>`;
      }

      // ── PAGE: HACKATHON LIST ─────────────────────────────────────
      function renderList(f) {
        _hf = f || "all";
        const filtered =
          _hf === "all"
            ? HACKATHONS
            : HACKATHONS.filter((h) => h.status === _hf);
        return `
<div class="wrap page">
  <div class="ph"><h1>해커톤 목록</h1><p>참가하고 싶은 해커톤을 찾아보세요.</p></div>
  <div class="ftabs">
    ${["all", "ongoing", "upcoming", "ended"]
      .map(
        (s) => `
    <button class="ftab${_hf === s ? " active" : ""}" onclick="go('/hackathons?status=${s}')">
      ${s === "all" ? "전체" : slabel(s)} <span style="opacity:.6">${s === "all" ? HACKATHONS.length : HACKATHONS.filter((h) => h.status === s).length}</span>
    </button>`,
      )
      .join("")}
  </div>
  <div class="grid">
    ${filtered.length ? filtered.map(hCard).join("") : `<div class="empty" style="grid-column:1/-1"><div class="ico">📭</div><p>해당 상태의 해커톤이 없습니다.</p></div>`}
  </div>
</div>`;
      }

      function hCard(h) {
        return `
<div class="hcard" onclick="go('/hackathons/${h.slug}')">
  <div class="hcard-thumb" style="background:${grad(h.slug)}"><span>${emoji(h.slug)}</span></div>
  <div class="hcard-body">
    <div class="hcard-title">${h.title}</div>
    <div class="tags">${h.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
    <div class="hcard-foot">
      <span class="sbadge s-${h.status}">${slabel(h.status)}</span>
      <span class="dl">마감 ${fmtD(h.period.submissionDeadlineAt)}</span>
    </div>
  </div>
</div>`;
      }

      // ── PAGE: HACKATHON DETAIL ───────────────────────────────────
      function renderDetail(slug, tabParam) {
        const hack = HACKATHONS.find((h) => h.slug === slug);
        const detail = DETAILS[slug];
        if (!hack || !detail)
          return `<div class="wrap page"><div class="empty"><div class="ico">🔍</div><p>해커톤을 찾을 수 없습니다.</p></div></div>`;
        if (tabParam) _tab = tabParam;
        const s = detail.sections;
        const TABS = [
          { id: "overview", label: "개요" },
          { id: "info", label: "안내" },
          { id: "eval", label: "평가" },
          { id: "schedule", label: "일정" },
          { id: "prize", label: "상금" },
          { id: "teams", label: "팀" },
          { id: "submit", label: "제출" },
          { id: "leaderboard", label: "리더보드" },
        ];
        if (!TABS.find((t) => t.id === _tab)) _tab = "overview";
        return `
<div class="wrap page">
  <button class="btn btn-o btn-sm" style="margin-bottom:1.25rem" onclick="go('/hackathons')">← 목록으로</button>
  <div class="dh">
    <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
      <span class="sbadge s-${hack.status}">${slabel(hack.status)}</span>
      ${hack.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
    </div>
    <h1>${hack.title}</h1>
    <div class="dh-meta">
      <span>📅 제출 마감: ${fmt(hack.period.submissionDeadlineAt)}</span>
      <span>🏁 대회 종료: ${fmt(hack.period.endAt)}</span>
    </div>
  </div>
  <div class="tab-nav">
    ${TABS.map((t) => `<button class="tbtn${_tab === t.id ? " active" : ""}" data-tab="${t.id}" onclick="switchTab('${slug}','${t.id}')">${t.label}</button>`).join("")}
  </div>
  <div id="tc">${tabContent(slug, _tab, s, hack)}</div>
</div>`;
      }

      function switchTab(slug, tab) {
        _tab = tab;
        document
          .querySelectorAll(".tbtn")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
        document.getElementById("tc").innerHTML = tabContent(
          slug,
          tab,
          DETAILS[slug].sections,
          HACKATHONS.find((h) => h.slug === slug),
        );
        scrollTo(
          0,
          document.getElementById("tc").getBoundingClientRect().top +
            scrollY -
            80,
        );
      }

      function tabContent(slug, tab, s, hack) {
        switch (tab) {
          case "overview":
            return tabOverview(s.overview);
          case "info":
            return tabInfo(s.info);
          case "eval":
            return tabEval(s.eval);
          case "schedule":
            return tabSchedule(s.schedule);
          case "prize":
            return tabPrize(s.prize);
          case "teams":
            return tabTeams(slug);
          case "submit":
            return tabSubmit(slug, s.submit);
          case "leaderboard":
            return tabLeaderboard(slug, s.leaderboard);
          default:
            return "";
        }
      }

      function tabOverview(ov) {
        return `
<div class="box"><h3>대회 소개</h3><p>${ov.summary}</p></div>
<div class="box"><h3>팀 구성 정책</h3>
  <div class="metrics">
    <div class="metric"><div class="metric-l">개인 참가</div><div class="metric-v">${ov.teamPolicy.allowSolo ? "✅ 가능" : "❌ 불가"}</div></div>
    <div class="metric"><div class="metric-l">최대 팀원</div><div class="metric-v">${ov.teamPolicy.maxTeamSize}명</div></div>
  </div>
</div>`;
      }

      function tabInfo(info) {
        return `
<div class="box"><h3>공지사항</h3><ul class="ilist">${info.notice.map((n) => `<li>${n}</li>`).join("")}</ul></div>
<div class="box"><h3>관련 링크</h3>
  <div style="display:flex;gap:.75rem;flex-wrap:wrap">
    <a href="${info.links.rules}" target="_blank" class="btn btn-o btn-sm">📋 규정 보기</a>
    <a href="${info.links.faq}" target="_blank" class="btn btn-o btn-sm">❓ FAQ</a>
  </div>
</div>`;
      }

      function tabEval(ev) {
        const bd = ev.scoreDisplay && ev.scoreDisplay.breakdown;
        return `
<div class="box"><h3>평가 지표</h3>
  <div class="metrics">
    <div class="metric"><div class="metric-l">지표명</div><div class="metric-v">${ev.metricName}</div></div>
    ${
      ev.limits
        ? `<div class="metric"><div class="metric-l">최대 런타임</div><div class="metric-v">${ev.limits.maxRuntimeSec}초</div></div>
    <div class="metric"><div class="metric-l">일일 최대 제출</div><div class="metric-v">${ev.limits.maxSubmissionsPerDay}회</div></div>`
        : ""
    }
  </div>
</div>
<div class="box"><h3>평가 방식</h3><p>${ev.description}</p>
  ${
    bd
      ? `<div style="margin-top:1.1rem">${bd
          .map(
            (b) => `
  <div class="sbar-wrap">
    <div class="sbar-label"><span>${b.label}</span><span>${b.weightPercent}%</span></div>
    <div class="sbar"><div class="sbar-fill" style="width:${b.weightPercent}%"></div></div>
  </div>`,
          )
          .join("")}</div>`
      : ""
  }
</div>`;
      }

      function tabSchedule(sch) {
        return `<div class="box"><h3>일정 (${sch.timezone})</h3>
<div class="timeline">${sch.milestones
          .map(
            (m) => `
<div class="titem${isPast(m.at) ? " past" : ""}">
  <div class="tdate">${fmt(m.at)}</div>
  <div class="tname">${m.name}${!isPast(m.at) ? ` <span style="font-size:.7rem;color:var(--blue);background:rgba(59,130,246,.12);padding:.1rem .4rem;border-radius:4px">예정</span>` : ""}</div>
</div>`,
          )
          .join("")}
</div></div>`;
      }

      function tabPrize(prize) {
        if (!prize)
          return `<div class="box"><p>상금 정보가 없습니다.</p></div>`;
        const med = ["🥇", "🥈", "🥉"];
        return `<div class="box"><h3>시상 내역</h3>
<div class="pgrid">${prize.items
          .map(
            (it, i) => `
<div class="pcard"><div style="font-size:1.6rem;margin-bottom:.4rem">${med[i] || "🏅"}</div>
<div class="pplace">${it.place}</div><div class="pamount">${krw(it.amountKRW)}</div></div>`,
          )
          .join("")}
</div></div>`;
      }

      function tabTeams(slug) {
        return `<div class="box"><h3>팀 모집</h3>
<p style="margin-bottom:1rem">이 해커톤의 팀원을 찾거나 새 팀을 만드세요.</p>
<button class="btn btn-p" onclick="go('/camp?hackathon=${slug}')">👥 팀원 모집 게시판 보기</button>
</div>`;
      }

      function tabSubmit(slug, submit) {
        const saved = getSubs()[slug] || {};
        const typeL = {
          zip: "ZIP 파일",
          url: "URL",
          text: "텍스트",
          pdf: "PDF URL",
        };
        const items = submit.submissionItems;
        return `
<div class="box"><h3>제출 안내</h3><ul class="ilist">${submit.guide.map((g) => `<li>${g}</li>`).join("")}</ul></div>
<div class="box"><h3>제출 양식</h3>
  <div class="tags" style="margin-bottom:1.1rem">
    ${submit.allowedArtifactTypes.map((t) => `<span class="tag" style="color:var(--pl);border-color:var(--primary)">${typeL[t] || t}</span>`).join("")}
  </div>
  <form id="subform" onsubmit="doSubmit(event,'${slug}')">
    ${
      items
        ? items
            .map(
              (it) => `
    <div class="fg">
      <label class="fl">${it.title}</label>
      ${
        it.format === "text_or_url"
          ? `<textarea class="fta" name="${it.key}" placeholder="텍스트 또는 URL 입력...">${saved[it.key] || ""}</textarea>`
          : `<input type="${it.format === "url" || it.format === "pdf_url" ? "url" : "text"}" class="fi" name="${it.key}" placeholder="${it.format.includes("url") ? "https://" : "입력..."}" value="${saved[it.key] || ""}">`
      }
    </div>`,
            )
            .join("")
        : `
    ${submit.allowedArtifactTypes.includes("zip") ? `<div class="fg"><label class="fl">파일명 (ZIP)</label><input type="text" class="fi" name="filename" placeholder="submission.zip" value="${saved.filename || ""}"></div>` : ""}
    ${submit.allowedArtifactTypes.includes("url") ? `<div class="fg"><label class="fl">제출 URL</label><input type="url" class="fi" name="url" placeholder="https://" value="${saved.url || ""}"></div>` : ""}
    ${submit.allowedArtifactTypes.includes("text") ? `<div class="fg"><label class="fl">기획서</label><textarea class="fta" name="text" placeholder="내용 입력...">${saved.text || ""}</textarea></div>` : ""}
    `
    }
    <div class="fg"><label class="fl">메모 (선택)</label><textarea class="fta" name="notes" style="min-height:70px" placeholder="추가 메모...">${saved.notes || ""}</textarea></div>
    <div style="display:flex;gap:.75rem">
      <button type="button" class="btn btn-o" onclick="doDraft('${slug}')">💾 임시저장</button>
      <button type="submit" class="btn btn-p">📤 최종 제출</button>
    </div>
  </form>
</div>`;
      }

      function doSubmit(e, slug) {
        e.preventDefault();
        const d = {};
        new FormData(e.target).forEach((v, k) => (d[k] = v));
        saveSub(slug, d);
        toast("✅ 제출 완료!");
      }
      function doDraft(slug) {
        const f = document.getElementById("subform");
        const d = {};
        new FormData(f).forEach((v, k) => (d[k] = v));
        saveSub(slug, d);
        toast("💾 임시저장 완료!");
      }

      function tabLeaderboard(slug, lbInfo) {
        const lb = LEADERBOARDS[slug];
        return `<div class="box"><h3>리더보드</h3>
${
  lb
    ? `
<div style="font-size:.76rem;color:var(--muted);margin-bottom:.85rem">최종 업데이트: ${fmt(lb.updatedAt)}</div>
${lbInfo.note ? `<div class="lb-note">${lbInfo.note}</div>` : ""}
<div class="ovx"><table class="tbl">
<thead><tr>
  <th>순위</th><th>팀명</th><th>점수</th>
  ${lb.entries[0]?.scoreBreakdown ? "<th>세부 점수</th>" : ""}
  <th>제출 시각</th>
  ${lb.entries[0]?.artifacts ? "<th>링크</th>" : ""}
</tr></thead>
<tbody>${lb.entries
        .map(
          (e) => `<tr>
  <td><span class="rank ${e.rank <= 3 ? "r" + e.rank : "rn"}">${e.rank}</span></td>
  <td style="font-weight:600">${e.teamName}</td>
  <td style="font-weight:700;color:var(--pl)">${e.score < 1 ? (e.score * 100).toFixed(2) + "%" : e.score}</td>
  ${e.scoreBreakdown ? `<td><div class="bc"><span class="bchip">참가자 <span>${e.scoreBreakdown.participant}</span></span><span class="bchip">심사 <span>${e.scoreBreakdown.judge}</span></span></div></td>` : lb.entries[0]?.scoreBreakdown ? "<td>-</td>" : ""}
  <td style="color:var(--muted);font-size:.78rem">${fmt(e.submittedAt)}</td>
  ${e.artifacts ? `<td>${e.artifacts.webUrl ? `<a href="${e.artifacts.webUrl}" target="_blank" style="color:var(--blue);font-size:.78rem;margin-right:.5rem">🌐 Web</a>` : ""}${e.artifacts.pdfUrl ? `<a href="${e.artifacts.pdfUrl}" target="_blank" style="color:var(--muted);font-size:.78rem">📄 PDF</a>` : ""}</td>` : lb.entries[0]?.artifacts ? "<td>-</td>" : ""}
</tr>`,
        )
        .join("")}
</tbody></table></div>`
    : `<p style="color:var(--muted)">아직 리더보드 데이터가 없습니다.</p>`
}
</div>`;
      }

      // ── PAGE: RANKINGS ──────────────────────────────────────────
      function renderRankings() {
        const all = [];
        Object.values(LEADERBOARDS).forEach((lb) => {
          const hack = HACKATHONS.find((h) => h.slug === lb.hackathonSlug);
          lb.entries.forEach((e) =>
            all.push({
              ...e,
              hackSlug: lb.hackathonSlug,
              hackTitle: hack?.title || lb.hackathonSlug,
            }),
          );
        });
        all.sort((a, b) => b.score - a.score);
        return `
<div class="wrap page">
  <div class="ph"><h1>🏆 글로벌 랭킹</h1><p>모든 해커톤 참가팀의 종합 랭킹입니다.</p></div>
  <div class="box"><div class="ovx"><table class="tbl">
    <thead><tr><th>#</th><th>팀명</th><th>해커톤</th><th>점수</th><th>제출일</th></tr></thead>
    <tbody>${all
      .map(
        (e, i) => `<tr>
      <td><span class="rank ${i < 3 ? "r" + (i + 1) : "rn"}">${i + 1}</span></td>
      <td style="font-weight:600">${e.teamName}</td>
      <td><span class="hchip" onclick="go('/hackathons/${e.hackSlug}')">${e.hackTitle.length > 22 ? e.hackTitle.slice(0, 22) + "…" : e.hackTitle}</span></td>
      <td style="font-weight:700;color:var(--pl)">${e.score < 1 ? (e.score * 100).toFixed(2) + "%" : e.score}</td>
      <td style="color:var(--muted);font-size:.78rem">${fmt(e.submittedAt)}</td>
    </tr>`,
      )
      .join("")}
    </tbody>
  </table></div></div>

  <div class="sh" style="margin-top:2rem"><div class="sh-t">해커톤별 TOP 팀</div></div>
  <div class="grid">${Object.values(LEADERBOARDS)
    .map((lb) => {
      const hack = HACKATHONS.find((h) => h.slug === lb.hackathonSlug);
      const top = lb.entries[0];
      return `<div class="box" style="cursor:pointer" onclick="go('/hackathons/${lb.hackathonSlug}?tab=leaderboard')">
      <div style="font-size:.74rem;color:var(--muted);margin-bottom:.5rem">${hack?.title || lb.hackathonSlug}</div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <span style="font-size:1.4rem">🥇</span>
        <div><div style="font-weight:700">${top.teamName}</div>
        <div style="font-size:.78rem;color:var(--pl)">Score: ${top.score < 1 ? (top.score * 100).toFixed(2) + "%" : top.score}</div></div>
      </div>
    </div>`;
    })
    .join("")}</div>
</div>`;
      }

      // ── PAGE: CAMP ──────────────────────────────────────────────
      function renderCamp(hFilter) {
        // 쉼표 구분 다중 슬러그 파싱 (예: "slug1,slug2")
        if (hFilter) {
          _campFilters = hFilter.split(",").filter(Boolean);
        } else {
          _campFilters = [];
        }
        _campDropdownOpen = false;
        return renderCampHTML();
      }

      function renderCampHTML() {
        const teams = getTeams();
        const filtered =
          _campFilters.length === 0
            ? teams
            : teams.filter((t) => _campFilters.includes(t.hackathonSlug));
        return `
<div class="wrap page" onclick="closeCampDropdown(event)">
  <div class="ph-row">
    <div class="ph">
      <h1>👥 팀원 모집</h1>
      <p>해커톤 팀을 찾거나 새 팀을 만드세요.</p>
    </div>
    <button class="btn btn-p" onclick="openTeamModal()">+ 팀 만들기</button>
  </div>

  <div style="position:relative;margin-bottom:1.5rem" id="camp-filter-wrap" onclick="event.stopPropagation()">
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-o btn-sm" onclick="toggleCampDropdown(event)" style="display:flex;align-items:center;gap:.4rem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        필터
        ${_campFilters.length > 0 ? `<span style="background:var(--primary);color:#fff;border-radius:100px;padding:.05rem .45rem;font-size:.68rem;margin-left:.1rem">${_campFilters.length}</span>` : ""}
      </button>
      ${_campFilters.map((slug) => {
        const h = HACKATHONS.find((x) => x.slug === slug);
        return h
          ? `<span style="display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;background:var(--pd);color:var(--pl);border:1px solid var(--primary);border-radius:100px;font-size:.78rem">
              ${h.title.length > 18 ? h.title.slice(0, 18) + "…" : h.title}
              <span onclick="toggleCampFilterSlug('${slug}')" style="cursor:pointer;opacity:.7;font-size:.8rem;line-height:1">✕</span>
            </span>`
          : "";
      }).join("")}
    </div>

    <div id="camp-filter-panel" style="display:${_campDropdownOpen ? "block" : "none"};position:absolute;top:calc(100% + .5rem);left:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;min-width:290px;box-shadow:0 8px 32px rgba(0,0,0,.5)">
      <div style="font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px">해커톤 선택</div>
      ${HACKATHONS.map((h) => {
        const cnt = teams.filter((t) => t.hackathonSlug === h.slug).length;
        const checked = _campFilters.includes(h.slug);
        return `<label style="display:flex;align-items:center;gap:.7rem;padding:.55rem 0;cursor:pointer;border-bottom:1px solid var(--border)">
          <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleCampFilterSlug('${h.slug}')" style="width:16px;height:16px;cursor:pointer;accent-color:var(--primary);flex-shrink:0">
          <span style="flex:1;font-size:.85rem;line-height:1.4">${h.title.length > 30 ? h.title.slice(0, 30) + "…" : h.title}</span>
          <span style="font-size:.75rem;color:var(--muted);flex-shrink:0">${cnt}팀</span>
        </label>`;
      }).join("")}
    </div>
  </div>

  <div class="grid">
    ${filtered.length
      ? filtered.map(teamCard).join("")
      : `<div class="empty" style="grid-column:1/-1"><div class="ico">👥</div><p>조건에 맞는 팀이 없습니다.</p></div>`}
  </div>
</div>`;
      }

      function toggleCampDropdown(e) {
        e.stopPropagation();
        _campDropdownOpen = !_campDropdownOpen;
        const panel = document.getElementById("camp-filter-panel");
        if (panel) panel.style.display = _campDropdownOpen ? "block" : "none";
      }

      function closeCampDropdown(e) {
        if (_campDropdownOpen) {
          _campDropdownOpen = false;
          const panel = document.getElementById("camp-filter-panel");
          if (panel) panel.style.display = "none";
        }
      }

      function toggleCampFilterSlug(slug) {
        if (_campFilters.includes(slug)) {
          _campFilters = _campFilters.filter((s) => s !== slug);
        } else {
          _campFilters.push(slug);
        }
        // URL 업데이트 (뒤로가기 히스토리 생성 없이)
        const newHash =
          _campFilters.length > 0
            ? "#/camp?hackathon=" + _campFilters.join(",")
            : "#/camp";
        history.replaceState(null, "", newHash);
        _campDropdownOpen = true;
        const app = document.getElementById("app");
        if (app) app.innerHTML = renderCampHTML();
      }

      function teamCard(t) {
        const hack = HACKATHONS.find((h) => h.slug === t.hackathonSlug);
        return `
<div class="tcard">
  <div class="tc-head">
    <div class="tname">${t.name}</div>
    <span class="opbadge ${t.isOpen ? "op-y" : "op-n"}">${t.isOpen ? "모집중" : "모집완료"}</span>
  </div>
  <div><span class="hchip" onclick="go('/hackathons/${t.hackathonSlug}')">${hack ? hack.title.slice(0, 24) + (hack.title.length > 24 ? "…" : "") : t.hackathonSlug}</span></div>
  <div class="tintro">${t.intro}</div>
  ${t.lookingFor.length ? `<div><div style="font-size:.72rem;color:var(--muted);margin-bottom:.3rem">모집 포지션</div><div class="lfor">${t.lookingFor.map((r) => `<span class="ltag">${r}</span>`).join("")}</div></div>` : ""}
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.15rem">
    <span style="font-size:.76rem;color:var(--muted)">👤 ${t.memberCount}명</span>
    ${t.isOpen ? `<a href="${t.contact.url}" target="_blank" class="cbtn">연락하기</a>` : `<span style="font-size:.76rem;color:var(--gray)">모집 마감</span>`}
  </div>
</div>`;
      }

      function openTeamModal() {
        document.getElementById("modal-root").innerHTML = `
<div class="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">팀 만들기</div>
      <button class="mclose" onclick="closeModalDirect()">✕</button>
    </div>
    <form onsubmit="createTeam(event)">
      <div class="fg"><label class="fl">팀 이름 *</label><input type="text" class="fi" name="name" required placeholder="팀 이름 입력"></div>
      <div class="fg"><label class="fl">해커톤 *</label>
        <select class="fi" name="hackathonSlug" required>
          <option value="">해커톤 선택</option>
          ${HACKATHONS.map((h) => `<option value="${h.slug}">${h.title}</option>`).join("")}
        </select>
      </div>
      <div class="fg"><label class="fl">팀 소개 *</label><textarea class="fta" name="intro" required placeholder="팀 소개를 입력하세요..."></textarea></div>
      <div class="fg"><label class="fl">모집 포지션 (쉼표로 구분)</label><input type="text" class="fi" name="lookingFor" placeholder="예: Frontend, Designer"></div>
      <div class="fg"><label class="fl">현재 팀원 수</label><input type="number" class="fi" name="memberCount" value="1" min="1" max="5"></div>
      <div class="fg"><label class="fl">연락처 URL *</label><input type="url" class="fi" name="contactUrl" required placeholder="https://open.kakao.com/..."></div>
      <div style="display:flex;gap:.75rem">
        <button type="button" class="btn btn-o" style="flex:1" onclick="closeModalDirect()">취소</button>
        <button type="submit" class="btn btn-p" style="flex:2">팀 생성</button>
      </div>
    </form>
  </div>
</div>`;
      }

      function closeModal(e) {
        if (e.target.classList.contains("overlay")) closeModalDirect();
      }
      function closeModalDirect() {
        document.getElementById("modal-root").innerHTML = "";
      }

      function createTeam(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const lf = fd
          .get("lookingFor")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        const team = {
          teamCode: "T-" + Date.now(),
          hackathonSlug: fd.get("hackathonSlug"),
          name: fd.get("name"),
          isOpen: true,
          memberCount: parseInt(fd.get("memberCount")) || 1,
          lookingFor: lf,
          intro: fd.get("intro"),
          contact: { url: fd.get("contactUrl") },
          createdAt: new Date().toISOString(),
        };
        const teams = getTeams();
        teams.unshift(team);
        saveTeams(teams);
        closeModalDirect();
        toast("✅ 팀이 생성되었습니다!");
        go("/camp?hackathon=" + team.hackathonSlug);
      }

      // ── INIT ────────────────────────────────────────────────────
      render();
      updateNav();
    </script>
  </body>
</html>
